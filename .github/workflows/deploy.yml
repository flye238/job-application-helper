# ==============================================================================
# GitHub Actions - Build Docker image and deploy to Azure Container Apps
# ==============================================================================

name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name jobasstacrojzb01

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="jobasstacrojzb01.azurecr.io/jobasst-app:${{ github.sha }}"
          cd backend
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Container App with new image
        run: |
          az containerapp update \
            --name jobasst-app-${{ secrets.RESOURCE_SUFFIX }} \
            --resource-group jobasst-rg-${{ secrets.RESOURCE_SUFFIX }} \
            --image ${{ env.IMAGE_TAG }} \
            --target-port 8000
