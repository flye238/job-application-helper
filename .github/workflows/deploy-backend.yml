name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  AZURE_FUNCTIONAPP_NAME: jobasst-func-${{ secrets.RESOURCE_SUFFIX }}
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Deploy zip to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group jobasst-rg-${{ secrets.RESOURCE_SUFFIX }} \
            --name jobasst-func-${{ secrets.RESOURCE_SUFFIX }} \
            --src backend.zip
